<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MiMo X — جارٍ التحميل</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 480px;
      height: 320px;
      background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      color: #e0e0e0;
      overflow: hidden;
    }
    .logo {
      width: 72px;
      height: 72px;
      background: linear-gradient(135deg, #10b981 0%, #06b6d4 100%);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 32px rgba(16, 185, 129, 0.3);
      margin-bottom: 24px;
      animation: pulse 2s ease-in-out infinite;
    }
    .logo svg { width: 40px; height: 40px; }
    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 8px 32px rgba(16, 185, 129, 0.3); }
      50% { transform: scale(1.05); box-shadow: 0 12px 40px rgba(16, 185, 129, 0.5); }
    }
    h1 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
      background: linear-gradient(90deg, #10b981, #06b6d4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle {
      font-size: 13px;
      color: #888;
      margin-bottom: 28px;
    }
    .loader {
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #10b981;
      animation: bounce 1.4s ease-in-out infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.5; }
      40% { transform: scale(1); opacity: 1; }
    }
    .status {
      font-size: 12px;
      color: #666;
      text-align: center;
    }
    .status .step {
      margin: 4px 0;
      opacity: 0;
      animation: fadeIn 0.5s ease forwards;
    }
    .status .step:nth-child(1) { animation-delay: 0.5s; }
    .status .step:nth-child(2) { animation-delay: 2s; }
    .status .step:nth-child(3) { animation-delay: 4s; }
    @keyframes fadeIn { to { opacity: 1; } }
    .check { color: #10b981; }
  </style>
</head>
<body>
  <div class="logo">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="white" stroke-width="2" stroke-linejoin="round"/>
      <path d="M2 17L12 22L22 17" stroke="white" stroke-width="2" stroke-linejoin="round"/>
      <path d="M2 12L12 17L22 12" stroke="white" stroke-width="2" stroke-linejoin="round"/>
    </svg>
  </div>
  <h1>MiMo X</h1>
  <p class="subtitle">مساعد ذكاء اصطناعي محلي</p>
  <div class="loader">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>
  <div class="status">
    <div class="step">⚡ تهيئة العتاد وتحميل النماذج…</div>
    <div class="step">🧠 تشغيل عامل المعالج (CPU Worker)…</div>
    <div class="step">✨ تجهيز الواجهة…</div>
  </div>
</body>
</html>
